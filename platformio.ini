[platformio]
; `pio run` compila so o ambiente normal; o de teste e explicito (-e).
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; A2DP + Wi-Fi + decoder MP3 nao cabem na particao padrao de 1.2MB.
board_build.partitions = huge_app.csv

lib_deps =
    ; servidor web assincrono
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    esphome/AsyncTCP-esphome @ ^2.1.4
    ; json
    bblanchon/ArduinoJson @ ^7.2.0
    ; display
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    ; audio: pipeline + decoder mp3 + fonte A2DP
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-libhelix.git
    https://github.com/pschatzmann/ESP32-A2DP.git

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Nivel 1 (so erros): no nivel 3 a biblioteca Bluetooth imprimia pela
    ; serial de dentro da propria tarefa de audio, roubando tempo de envio.

; Ambiente de desenvolvimento: sempre liga no modo Web, sem precisar do botao.
; Uso: pio run -e esp32dev-web -t upload
[env:esp32dev-web]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DLOCALFY_FORCE_WEB_MODE
