<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="920" height="600" fill="#fafaf7"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Localfy: ligação da bateria, chave e regulador</text>

  <!-- ===== fios (embaixo dos componentes) ===== -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- bateria -> pads do TP4056 -->
    <path d="M150 400 V330 H262 V180" stroke="#d62828"/>
    <path d="M175 400 V345 H286 V230" stroke="#222"/>
    <path d="M240 180 H262" stroke="#d62828"/>
    <path d="M240 230 H286" stroke="#222"/>
    <!-- BAT+ -> meio da chave -->
    <path d="M262 180 H380 V150" stroke="#d62828"/>
    <!-- ponta da chave -> MT3608 VIN+ -->
    <path d="M410 150 V195 H480" stroke="#d62828"/>
    <!-- BAT- -> MT3608 VIN- -->
    <path d="M286 230 V245 H480" stroke="#222"/>
    <!-- MT3608 VOUT- -> ESP32 GND -->
    <path d="M640 195 H700 V330 H730" stroke="#222"/>
    <!-- MT3608 VOUT+ -> ESP32 VIN -->
    <path d="M640 245 H680 V360 H730" stroke="#d62828"/>
    <!-- microSD -->
    <path d="M680 360 V470 H630" stroke="#d62828"/>
    <path d="M450 245 V470 H490" stroke="#222"/>
  </g>
  <g fill="#222">
    <circle cx="262" cy="180" r="6" fill="#d62828"/>
    <circle cx="286" cy="230" r="6"/>
    <circle cx="450" cy="245" r="6"/>
    <circle cx="680" cy="360" r="6" fill="#d62828"/>
  </g>

  <!-- ===== bateria ===== -->
  <rect x="60" y="400" width="190" height="110" rx="10" fill="#d9d9d9" stroke="#888" stroke-width="2"/>
  <rect x="60" y="400" width="190" height="26" rx="6" fill="#f2c94c" stroke="#888" stroke-width="2"/>
  <text x="155" y="463" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Bateria LiPo</text>
  <text x="155" y="486" text-anchor="middle" font-size="14" fill="#444">3,7 V · 2000 mAh</text>
  <text x="140" y="418" text-anchor="end" font-size="14" font-weight="bold" fill="#d62828">+</text>
  <text x="190" y="419" font-size="16" font-weight="bold" fill="#222">−</text>

  <!-- ===== TP4056 ===== -->
  <rect x="70" y="140" width="170" height="120" rx="6" fill="#1f5fa8" stroke="#123c6b" stroke-width="2"/>
  <rect x="44" y="180" width="40" height="40" rx="8" fill="#b8b8b8" stroke="#555" stroke-width="2"/>
  <text x="155" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">TP4056 (carregador)</text>
  <text x="64" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#222">USB-C</text>
  <text x="40" y="282" font-size="13" fill="#1f5fa8" font-weight="bold">← cabo aqui para carregar</text>
  <rect x="224" y="171" width="16" height="18" fill="#e0b84f"/>
  <rect x="224" y="221" width="16" height="18" fill="#e0b84f"/>
  <text x="218" y="185" text-anchor="end" font-size="14" fill="#fff" font-weight="bold">BAT+</text>
  <text x="218" y="235" text-anchor="end" font-size="14" fill="#fff" font-weight="bold">BAT−</text>
  <text x="150" y="160" text-anchor="middle" font-size="11" fill="#cfe0f5">IN+ / IN−: não usar</text>

  <!-- ===== chave ===== -->
  <rect x="345" y="92" width="80" height="40" rx="4" fill="#333"/>
  <rect x="392" y="74" width="16" height="22" rx="3" fill="#888"/>
  <rect x="349" y="132" width="6" height="18" fill="#c9a227"/>
  <rect x="377" y="132" width="6" height="18" fill="#c9a227"/>
  <rect x="407" y="132" width="6" height="18" fill="#c9a227"/>
  <text x="385" y="64" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Chave liga/desliga</text>
  <text x="440" y="90" font-size="13" fill="#2a8a3e" font-weight="bold">alavanca → LIGA</text>
  <text x="352" y="166" text-anchor="middle" font-size="11" fill="#777">vazio</text>
  <text x="380" y="122" text-anchor="middle" font-size="11" fill="#fff">meio</text>
  <text x="330" y="205" text-anchor="middle" font-size="12" fill="#d62828">+ sempre</text>
  <text x="445" y="217" text-anchor="middle" font-size="11" fill="#d62828">+ só ligado</text>

  <!-- ===== MT3608 ===== -->
  <rect x="480" y="160" width="160" height="110" rx="6" fill="#1f5fa8" stroke="#123c6b" stroke-width="2"/>
  <rect x="538" y="180" width="26" height="26" fill="#4a90e2" stroke="#fff" stroke-width="1.5"/>
  <circle cx="551" cy="193" r="5" fill="#fff"/>
  <rect x="540" y="222" width="30" height="30" fill="#222"/>
  <text x="560" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">MT3608 (regulador)</text>
  <text x="560" y="292" text-anchor="middle" font-size="13" fill="#2a8a3e" font-weight="bold">já regulado em 5,0 V ✓</text>
  <text x="488" y="200" font-size="12" fill="#fff" font-weight="bold">VIN+</text>
  <text x="488" y="250" font-size="12" fill="#fff" font-weight="bold">VIN−</text>
  <text x="632" y="200" text-anchor="end" font-size="12" fill="#fff" font-weight="bold">VOUT−</text>
  <text x="632" y="250" text-anchor="end" font-size="12" fill="#fff" font-weight="bold">VOUT+</text>
  <text x="560" y="312" text-anchor="middle" font-size="11" fill="#666">(confira os nomes VIN/VOUT na sua placa)</text>

  <!-- ===== ESP32 ===== -->
  <rect x="730" y="80" width="150" height="320" rx="8" fill="#2b2b2b" stroke="#111" stroke-width="2"/>
  <rect x="755" y="95" width="100" height="70" rx="4" fill="#aaa"/>
  <text x="805" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">ESP32</text>
  <rect x="790" y="388" width="30" height="16" rx="3" fill="#b8b8b8"/>
  <g fill="#c9a227">
    <circle cx="742" cy="190" r="4"/><circle cx="742" cy="210" r="4"/><circle cx="742" cy="230" r="4"/>
    <circle cx="742" cy="250" r="4"/><circle cx="742" cy="270" r="4"/><circle cx="742" cy="290" r="4"/>
    <circle cx="742" cy="310" r="4"/>
  </g>
  <circle cx="742" cy="330" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="742" cy="360" r="6" fill="#fff" stroke="#d62828" stroke-width="2"/>
  <text x="756" y="335" font-size="14" fill="#fff" font-weight="bold">GND</text>
  <text x="756" y="365" font-size="14" fill="#ffb3b3" font-weight="bold">VIN (5V)</text>
  <text x="805" y="430" text-anchor="middle" font-size="12" fill="#d62828" font-weight="bold">nunca no 3V3!</text>
  <text x="805" y="448" text-anchor="middle" font-size="11" fill="#666">OLED e pot. continuam no 3V3</text>

  <!-- ===== microSD ===== -->
  <rect x="490" y="440" width="140" height="70" rx="6" fill="#1f5fa8" stroke="#123c6b" stroke-width="2"/>
  <rect x="520" y="455" width="80" height="40" rx="3" fill="#c9c9c9"/>
  <text x="560" y="480" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">microSD</text>
  <text x="470" y="462" text-anchor="middle" font-size="12" fill="#222">GND</text>
  <text x="655" y="462" text-anchor="middle" font-size="12" fill="#d62828">VCC</text>
  <text x="560" y="528" text-anchor="middle" font-size="11" fill="#666">os outros 4 fios do SD continuam como estão</text>

  <!-- ===== legenda ===== -->
  <g font-size="14">
    <line x1="40" y1="560" x2="80" y2="560" stroke="#d62828" stroke-width="5"/>
    <text x="90" y="565">positivo (+)</text>
    <line x1="210" y1="560" x2="250" y2="560" stroke="#222" stroke-width="5"/>
    <text x="260" y="565">negativo / GND</text>
    <circle cx="400" cy="560" r="6" fill="#222"/>
    <text x="414" y="565">emenda (fios ligados juntos)</text>
    <text x="40" y="588" font-size="13" fill="#b5651d" font-weight="bold">⚠ Para gravar o firmware pelo USB do ESP32, deixe a chave DESLIGADA.</text>
  </g>
</svg>
