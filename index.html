<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121212" />
    <title>Localfy</title>
    <style>
      :root {
        --bg: #f4f6f4;        /* fundo da pagina */
        --card: #ffffff;      /* cartoes */
        --card2: #eef1ef;     /* preenchimento sutil (campos, chips) */
        --card3: #dfe4e0;     /* hover / bordas */
        --green: #1db954;     /* verde Spotify: fundo de botao, nunca texto */
        --green-h: #17a449;
        /* Sobre branco o verde puro rende apenas 2.6:1, insuficiente para
           texto. Este tom escuro chega a 6.6:1 e e usado quando o verde
           precisa ser lido. */
        --green-txt: #0d6b32;
        --green-soft: #e6f6ec; /* realce de fundo bem claro */
        --txt: #1a1c1a;       /* 17:1 sobre branco */
        --txt2: #5c625e;      /* 6.2:1 - secundario */
        --txt3: #696f69;      /* 4.5:1 mesmo sobre os campos cinza */
        --red: #c31f42;
        --line: #e4e8e5;      /* divisorias */
        --shadow: 0 1px 2px rgba(16, 24, 18, 0.06),
          0 2px 8px rgba(16, 24, 18, 0.05);
        --radius: 8px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--txt);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.4;
        overflow: hidden;
      }
      button,
      input,
      select {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
        border: 0;
        background: none;
        outline: none;
      }
      button {
        cursor: pointer;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---------- Header ---------- */
      header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .logo {
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--green);
        display: grid;
        place-items: center;
      }
      .logo svg {
        width: 17px;
        height: 17px;
        fill: #000;
      }
      .brand h1 {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand small {
        display: block;
        font-size: 11px;
        font-weight: 400;
        color: var(--txt2);
      }
      .hspace {
        flex: 1;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 13px;
        border-radius: 999px;
        background: var(--card2);
        font-size: 12px;
        font-weight: 600;
        color: var(--txt2);
        transition:
          background 0.18s,
          color 0.18s;
        white-space: nowrap;
      }
      .chip:hover {
        background: var(--card3);
        color: var(--txt);
      }
      .chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--txt3);
        flex: 0 0 auto;
      }
      .chip.ok {
        color: var(--txt);
      }
      .chip.ok .dot {
        background: var(--green);
        box-shadow: 0 0 6px var(--green);
      }
      .chip.busy .dot {
        background: #f0c040;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      .chip svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }
      @media (max-width: 560px) {
        .chip .lbl {
          display: none;
        }
        .chip {
          padding: 8px 10px;
        }
      }

      /* ---------- Scroll area ---------- */
      main {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 18px 18px 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--card3) transparent;
      }
      main::-webkit-scrollbar {
        width: 8px;
      }
      main::-webkit-scrollbar-thumb {
        background: var(--card3);
        border-radius: 4px;
      }
      main::-webkit-scrollbar-thumb:hover {
        background: #c8cfca;
      }
      main::-webkit-scrollbar-track {
        background: transparent;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 18px;
        box-shadow: var(--shadow);
      }
      .card h2 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card h2 .count {
        font-size: 12px;
        font-weight: 500;
        color: var(--txt2);
      }

      /* ---------- Upload ---------- */
      .drop {
        border: 2px dashed var(--card3);
        border-radius: var(--radius);
        padding: 26px 18px;
        text-align: center;
        transition:
          border-color 0.18s,
          background 0.18s;
        cursor: pointer;
      }
      .drop:hover,
      .drop.over {
        border-color: var(--green);
        background: var(--green-soft);
      }
      .drop svg {
        width: 34px;
        height: 34px;
        fill: var(--txt2);
        margin-bottom: 8px;
      }
      .drop.over svg {
        fill: var(--green);
      }
      .drop b {
        display: block;
        font-size: 14px;
        margin-bottom: 3px;
      }
      .drop span {
        font-size: 12px;
        color: var(--txt2);
      }
      .up-list {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .up-item {
        background: var(--card2);
        border-radius: 6px;
        padding: 10px 12px;
      }
      .up-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .up-head .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .up-head .pc {
        color: var(--txt2);
        font-variant-numeric: tabular-nums;
      }
      .up-head .x {
        color: var(--txt3);
        padding: 0 2px;
        line-height: 1;
      }
      .up-head .x:hover {
        color: var(--txt);
      }
      .bar {
        height: 5px;
        border-radius: 3px;
        background: var(--card3);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--green);
        border-radius: 3px;
        transition: width 0.2s linear;
      }
      .up-item.err .bar > i {
        background: var(--red);
      }
      .up-item.err .pc {
        color: var(--red);
      }
      .up-item.done .pc {
        color: var(--green-txt);
      }

      /* ---------- Filters ---------- */
      .tools {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        background: var(--card2);
        padding: 4px;
        border-radius: 999px;
      }
      .tabs button {
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        color: var(--txt2);
        transition: 0.18s;
      }
      .tabs button:hover {
        color: var(--txt);
      }
      .tabs button.on {
        background: var(--green);
        color: #000;
      }
      .search {
        flex: 1;
        min-width: 160px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--card2);
        border-radius: 999px;
        padding: 0 14px;
        height: 36px;
      }
      .search svg {
        width: 15px;
        height: 15px;
        fill: var(--txt2);
        flex: 0 0 auto;
      }
      .search input {
        flex: 1;
        min-width: 0;
        height: 100%;
        font-size: 13px;
      }
      .search input::placeholder {
        color: var(--txt3);
      }

      /* ---------- Song list ---------- */
      .songs {
        display: flex;
        flex-direction: column;
      }
      .song {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 10px;
        border-radius: 6px;
        transition: background 0.15s;
        cursor: default;
      }
      .song:hover {
        background: var(--card2);
      }
      .song .pbtn {
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--card2);
        border: 1px solid var(--card3);
        display: grid;
        place-items: center;
        transition: 0.18s;
      }
      .song:hover .pbtn,
      .song.now .pbtn {
        background: var(--green);
        border-color: var(--green);
      }
      .song .pbtn svg {
        width: 13px;
        height: 13px;
        fill: var(--txt);
      }
      .song:hover .pbtn svg,
      .song.now .pbtn svg {
        fill: #000;
      }
      .song .meta {
        flex: 1;
        min-width: 0;
      }
      .song .t {
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .song.now .t {
        color: var(--green-txt);
        font-weight: 600;
      }
      .song .s {
        font-size: 11px;
        color: var(--txt2);
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 2px;
      }
      .tag {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.6px;
        padding: 2px 6px;
        border-radius: 3px;
        background: var(--card3);
        color: var(--txt2);
      }
      .tag.mp3 {
        background: #e3ecfb;
        color: #2c4f8f;
      }
      .tag.wav {
        background: #efe6fb;
        color: #5b3a8f;
      }
      .song .del {
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        border-radius: 50%;
        display: grid;
        place-items: center;
        opacity: 0;
        transition: 0.18s;
      }
      .song:hover .del,
      .song:focus-within .del {
        opacity: 1;
      }
      .song .del svg {
        width: 15px;
        height: 15px;
        fill: var(--txt2);
      }
      .song .del:hover {
        background: var(--card3);
      }
      .song .del:hover svg {
        fill: var(--red);
      }
      @media (max-width: 560px) {
        .song .del {
          opacity: 1;
        }
      }
      .empty {
        text-align: center;
        padding: 30px 10px;
        color: var(--txt2);
        font-size: 13px;
      }

      /* ---------- Bottom player ---------- */
      .player {
        flex: 0 0 auto;
        background: var(--card);
        border-top: 1px solid var(--line);
        box-shadow: 0 -2px 10px rgba(16, 24, 18, 0.05);
        padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .pl-now {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 30%;
        min-width: 0;
      }
      .art {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        border-radius: 5px;
        background: var(--card2);
        display: grid;
        place-items: center;
      }
      .art svg {
        width: 19px;
        height: 19px;
        fill: var(--txt3);
      }
      .art.on svg {
        fill: var(--green);
      }
      .pl-now .t {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pl-now .s {
        font-size: 11px;
        color: var(--txt2);
      }
      .pl-mid {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .ctrls {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .ctrls button {
        display: grid;
        place-items: center;
        transition:
          transform 0.15s,
          opacity 0.15s;
      }
      .ctrls button svg {
        fill: var(--txt2);
        width: 17px;
        height: 17px;
        transition: fill 0.15s;
      }
      .ctrls button:hover svg {
        fill: var(--txt);
      }
      .ctrls button:active {
        transform: scale(0.9);
      }
      .play {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--green);
      }
      .play svg {
        fill: #000 !important;
        width: 15px;
        height: 15px;
      }
      .play:hover {
        transform: scale(1.07);
      }
      .seek {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        max-width: 520px;
      }
      .seek span {
        font-size: 11px;
        color: var(--txt2);
        font-variant-numeric: tabular-nums;
        min-width: 34px;
        text-align: center;
      }
      .pl-vol {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 30%;
        justify-content: flex-end;
      }
      .pl-vol svg {
        width: 17px;
        height: 17px;
        fill: var(--txt2);
        flex: 0 0 auto;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        height: 14px;
        cursor: pointer;
        width: 100%;
        min-width: 0;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background:
          linear-gradient(var(--green), var(--green)) 0 / var(--fill, 0%) 100%
            no-repeat,
          var(--card3);
      }
      input[type="range"]::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: var(--card3);
      }
      input[type="range"]::-moz-range-progress {
        height: 4px;
        border-radius: 2px;
        background: var(--green);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        margin-top: -4px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        opacity: 0;
      }
      input[type="range"]:hover::-webkit-slider-thumb,
      input[type="range"]:active::-webkit-slider-thumb {
        opacity: 1;
      }
      input[type="range"]:hover::-moz-range-thumb {
        opacity: 1;
      }
      .volwrap {
        max-width: 110px;
      }
      @media (max-width: 700px) {
        .pl-vol {
          display: none;
        }
        .pl-now {
          width: auto;
          flex: 0 0 auto;
        }
        .pl-now .txt {
          display: none;
        }
        .pl-mid {
          width: auto;
        }
      }

      /* ---------- Modal ---------- */
      .mask {
        position: fixed;
        inset: 0;
        background: rgba(26, 28, 26, 0.45);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .mask.on {
        opacity: 1;
        pointer-events: auto;
      }
      .modal {
        background: var(--card);
        border-radius: 12px;
        /* O .body tem overflow-y:auto e, sem isto, desenha seus cantos retos
           por cima do arredondamento do pai -- o rodape saia quadrado. */
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(16, 24, 18, 0.18);
        width: 100%;
        max-width: 420px;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        transform: translateY(12px) scale(0.98);
        transition: transform 0.2s;
      }
      .mask.on .modal {
        transform: none;
      }
      .modal header {
        background: none;
        border: 0;
        padding: 18px 18px 12px;
      }
      .modal h3 {
        font-size: 16px;
        font-weight: 700;
        flex: 1;
      }
      .modal .body {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 0 18px 20px;
        scrollbar-width: thin;
        scrollbar-color: var(--card3) transparent;
      }
      .modal .body::-webkit-scrollbar {
        width: 6px;
      }
      .modal .body::-webkit-scrollbar-thumb {
        background: var(--card3);
        border-radius: 3px;
      }
      .btn {
        background: var(--green);
        color: #000;
        font-weight: 700;
        font-size: 13px;
        padding: 10px 18px;
        border-radius: 999px;
        transition:
          transform 0.15s,
          background 0.15s;
      }
      .btn:hover {
        background: var(--green-h);
        transform: scale(1.03);
      }
      .btn:disabled {
        background: var(--card3);
        color: var(--txt2);
        cursor: default;
        transform: none;
      }
      .btn.ghost {
        background: var(--card2);
        color: var(--txt);
      }
      .btn.ghost:hover {
        background: var(--card3);
      }
      .btn.wide {
        width: 100%;
      }
      .dev {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px;
        border-radius: 6px;
        transition: background 0.15s;
      }
      .dev:hover {
        background: var(--card2);
      }
      .dev .meta {
        flex: 1;
        min-width: 0;
      }
      .dev .n {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dev .a {
        font-size: 11px;
        color: var(--txt2);
        font-family: monospace;
      }
      .dev.cur .n {
        color: var(--green-txt);
        font-weight: 600;
      }
      .spin {
        width: 16px;
        height: 16px;
        border: 2px solid var(--card3);
        border-top-color: var(--green);
        border-radius: 50%;
        animation: sp 0.7s linear infinite;
        flex: 0 0 auto;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }

      .tag.gen {
        background: var(--green-soft);
        color: var(--green-txt);
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: var(--txt2);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        background: var(--card2);
        border-radius: 6px;
        padding: 11px 13px;
        font-size: 14px;
      }
      .field input:focus {
        box-shadow: inset 0 0 0 2px var(--green);
      }
      .field .hint {
        font-size: 11px;
        color: var(--txt3);
        margin-top: 5px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .chips button {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--card2);
        color: var(--txt2);
        transition: 0.15s;
      }
      .chips button:hover {
        background: var(--card3);
        color: var(--txt);
      }

      /* ---------- Test mode badge ---------- */
      .mockbar {
        display: none;
        flex: 0 0 auto;
        align-items: center;
        gap: 10px;
        padding: 7px 18px;
        background: #f0c040;
        color: #000;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      html.mock .mockbar {
        display: flex;
      }
      .mockbar .sp {
        flex: 1;
      }
      .mockbar button {
        background: rgba(0, 0, 0, 0.12);
        color: #000;
        font-weight: 700;
        font-size: 11px;
        padding: 4px 11px;
        border-radius: 999px;
        transition: background 0.15s;
      }
      .mockbar button:hover {
        background: rgba(0, 0, 0, 0.22);
      }

      /* ---------- Toast ---------- */
      #toasts {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        z-index: 80;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        pointer-events: none;
      }
      .toast {
        background: var(--txt);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 999px;
        box-shadow: 0 8px 28px rgba(16, 24, 18, 0.22);
        animation: tin 0.25s;
      }
      .toast.bad {
        background: var(--red);
        color: #fff;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="mockbar">
        <span>⚙ MODO DE TESTES — dados simulados, o ESP32 não está sendo usado</span>
        <span class="sp"></span>
        <button id="mockOff">Sair do modo de testes</button>
      </div>
      <header>
        <div class="brand">
          <div class="logo">
            <svg viewBox="0 0 24 24">

              d="M12 2l5 5-3.6 3.6L17 14.2l-5 5V13l-3 3-1.4-1.4L11.6 11 7.6 7.4 9 6l3 3V2zm1.6 5L13 6.4v1.9l.6-.6zM13 15.7v1.9l.6-.6-.6-.6z"

      <main>
        <div class="wrap">
          <!-- Upload -->
          <section class="card">
            <h2>Enviar músicas</h2>
            <div class="drop" id="drop">
              <svg viewBox="0 0 24 24">

              <label class="search">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M10 2a8 8 0 105 14.3l5.3 5.4 1.4-1.4-5.4-5.3A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"

      <footer class="player">

    <!-- Editar artista / genero -->
    <div class="mask" id="metaMask">
      <div class="modal">
        <header style="display: flex; align-items: center; gap: 10px">
          <h3>Detalhes da musica</h3>

          <div
            id="metaFile"
            style="
              font-size: 12px;

            "
          ></div>

    <!-- Bluetooth modal -->
    <div class="mask" id="btMask">
      <div class="modal">
        <header style="display: flex; align-items: center; gap: 10px">
          <h3>Dispositivos Bluetooth</h3>
          <button class="chip" id="btClose" style="padding: 6px 10px">
            Fechar
          </button>
        </header>
        <div class="body">
          <div id="btCurrent" style="margin-bottom: 12px"></div>
          <button class="btn wide" id="btScan">Procurar dispositivos</button>
          <div id="btList" style="margin-top: 12px"></div>
        </div>
      </div>
    </div>

    <div id="toasts"></div>

    <script>
      "use strict";
      /* ========= util ========= */
      const $ = (s) => document.querySelector(s);
      const el = (t, c) => {
        const n = document.createElement(t);
        if (c) n.className = c;
        return n;
      };
      const fmtTime = (s) => {
        s = Math.max(0, Math.floor(s || 0));
        return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      };
      const fmtSize = (b) => {
        if (!b && b !== 0) return "";
        if (b < 1024) return b + " B";
        if (b < 1048576) return (b / 1024).toFixed(0) + " KB";
        return (b / 1048576).toFixed(1) + " MB";
      };
      const ext = (n) => (n.split(".").pop() || "").toLowerCase();
      const baseName = (n) => n.replace(/\.[^.]+$/, "");

      function toast(msg, bad) {
        const t = el("div", "toast" + (bad ? " bad" : ""));
        t.textContent = msg;
        $("#toasts").appendChild(t);
        setTimeout(() => {
          t.style.transition = "opacity .3s";
          t.style.opacity = "0";
          setTimeout(() => t.remove(), 300);
        }, 2600);
      }

      /* ========= MODO DE TESTES (mock backend) =========
         Ativa quando: ?mock=1 na URL, localStorage.localfyMock="1",
         ou a página é aberta via file:// (sem ESP32 por perto).
         Desativar: ?mock=0  ·  Alternar: tecla M                        */
      const MOCK = (() => {
        const p = new URLSearchParams(location.search);
        if (p.has("mock")) {
          const on = p.get("mock") !== "0";
          try {
            localStorage.setItem("localfyMock", on ? "1" : "0");
          } catch (e) {}
          return on;
        }
        try {
          const v = localStorage.getItem("localfyMock");
          if (v !== null) return v === "1";
        } catch (e) {}
        return location.protocol === "file:";
      })();

      const Mock = {
        lat: 90, // latência simulada (ms)
        songs: [
          { name: "Bohemian Rhapsody.mp3", size: 8912345, duration: 355, artist: "Queen", genre: "Rock" },
          { name: "Take Five.mp3", size: 6210044, duration: 324, artist: "Dave Brubeck", genre: "Jazz" },
          { name: "Sample Loop 44k.wav", size: 15872000, duration: 90, artist: "", genre: "" },
          { name: "Clair de Lune.mp3", size: 7104512, duration: 301, artist: "Debussy", genre: "Classica" },
          { name: "Bip de Teste.wav", size: 352844, duration: 2, artist: "", genre: "" },
          { name: "Aquarela do Brasil.mp3", size: 5433210, duration: 226, artist: "Ary Barroso", genre: "MPB" },
        ],
        st: {
          device: "Localfy (MOCK)",
          wifi: {
            connected: true,
            ssid: "RedeDeTeste",
            ip: "192.168.0.42",
            rssi: -57,
          },
          bt: { state: "disconnected", name: "", address: "" },
          file: "",
          playing: false,
          position: 0,
          duration: 0,
          volume: 60,
        },
        found: [],
        history: [],
        tick: 0,
        idx() {
          return this.songs.findIndex((s) => s.name === this.st.file);
        },
        // mesma regra do firmware: 20s ou 35% da faixa
        scrobble() {
          const s = this.songs.find((x) => x.name === this.st.file);
          if (!s || this.scrobbled) return;
          const secs = Math.floor(this.listened);
          if (secs < 20 && !(s.duration && secs >= s.duration * 0.35)) return;
          this.history.push({
            ts: Date.now() / 1000,
            file: s.name,
            artist: s.artist || "",
            genre: s.genre || "",
            secs,
          });
          this.scrobbled = true;
        },
        load(name) {
          const s = this.songs.find((x) => x.name === name);
          if (!s) throw new Error("404");
          this.scrobble();
          this.listened = 0;
          this.scrobbled = false;
          this.st.file = s.name;
          this.st.duration = s.duration;
          this.st.position = 0;
          this.st.playing = true;
        },
        step(i) {
          if (!this.songs.length) return;
          const n = this.idx();
          this.load(this.songs[(n + i + this.songs.length) % this.songs.length].name);
        },
        // avança o relógio do player — chamado por um timer de 250ms
        advance(dt) {
          if (!this.st.playing || this.st.duration <= 0) return;
          this.st.position += dt;
          this.listened = (this.listened || 0) + dt;
          if (this.st.position >= this.st.duration) {
            this.listened = this.st.duration;
            this.step(1);
          }
        },
        handle(path, method, body) {
          const b = body || {};
          switch (path) {
            case "/api/songs":
              return {
                songs: this.songs.map(({ name, size, artist, genre }) => ({
                  name,
                  size,
                  artist: artist || "",
                  genre: genre || "",
                })),
              };
            case "/api/meta": {
              const s = this.songs.find((x) => x.name === b.file);
              if (!s) throw new Error("404");
              s.artist = b.artist || "";
              s.genre = b.genre || "";
              return { ok: true };
            }
            case "/api/stats": {
              const cnt = (key) => {
                const m = new Map();
                for (const h of this.history) {
                  const v = h[key];
                  if (v) m.set(v, (m.get(v) || 0) + 1);
                }
                return [...m]
                  .map(([name, plays]) => ({ name, plays }))
                  .sort((a, c) => c.plays - a.plays)
                  .slice(0, 10);
              };
              return {
                plays: this.history.length,
                seconds: this.history.reduce((a, h) => a + h.secs, 0),
                topArtists: cnt("artist"),
                topGenres: cnt("genre"),
              };
            }
            case "/api/status":
              return JSON.parse(JSON.stringify(this.st));
            case "/api/play":
              this.load(b.file);
              return { ok: true };
            case "/api/pause":
              this.st.playing = false;
              return { ok: true };
            case "/api/resume":
              if (!this.st.file) this.step(0);
              this.st.playing = true;
              return { ok: true };
            case "/api/next":
              this.step(1);
              return { ok: true };
            case "/api/prev":
              this.st.position > 3 ? (this.st.position = 0) : this.step(-1);
              return { ok: true };
            case "/api/seek":
              this.st.position = Math.min(+b.position || 0, this.st.duration);
              return { ok: true };
            case "/api/volume":
              this.st.volume = Math.max(0, Math.min(100, +b.volume || 0));
              return { ok: true };
            case "/api/delete": {
              const n = this.songs.length;
              this.songs = this.songs.filter((s) => s.name !== b.file);
              if (this.songs.length === n) throw new Error("404");
              if (this.st.file === b.file) {
                this.scrobble();
                this.st.file = "";
                this.st.playing = false;
                this.st.position = this.st.duration = 0;
              }
              return { ok: true };
            }
            case "/api/bt-scan":
              this.st.bt.state = "scanning";
              this.found = [];
              // devolve os dispositivos aos poucos, como um scan de verdade
              [
                { name: "JBL Flip 6", address: "AC:BC:32:8E:11:04", rssi: -48 },
                { name: "Fone do Quarto", address: "5C:F3:70:2A:9B:C1", rssi: -63 },
                { name: "Soundbar Sala", address: "00:1A:7D:DA:71:13", rssi: -77 },
                { name: "", address: "E8:07:BF:41:22:90", rssi: -85 },
              ].forEach((d, i) =>
                setTimeout(() => {
                  if (this.st.bt.state === "scanning") this.found.push(d);
                }, 800 + i * 900),
              );
              setTimeout(() => {
                if (this.st.bt.state === "scanning")
                  this.st.bt.state = this.st.bt.address ? "connected" : "disconnected";
              }, 5200);
              return { ok: true };
            case "/api/bt-devices":
              return { devices: this.found.slice() };
            case "/api/bt-connect":
              this.st.bt = { state: "connecting", name: b.name || "", address: b.address || "" };
              setTimeout(() => {
                this.st.bt.state = "connected";
              }, 1800);
              return { ok: true };
            case "/api/bt-disconnect":
              this.st.bt = { state: "disconnected", name: "", address: "" };
              return { ok: true };
            case "/api/upload":
              return { ok: true };
          }
          throw new Error("404 " + path);
        },
        // upload falso: progresso incremental sem rede
        upload(file, onProgress, onDone, onError) {
          if (this.songs.some((s) => s.name === file.name))
            return setTimeout(() => onError("Já existe"), 300);
          let sent = 0;
          const chunk = Math.max(file.size / 28, 1);
          const t = setInterval(() => {
            sent = Math.min(sent + chunk, file.size);
            onProgress(sent, file.size);
            if (sent >= file.size) {
              clearInterval(t);
              this.songs.push({
                name: file.name,
                size: file.size,
                duration: 30 + Math.floor(Math.random() * 240),
              });
              onDone();
            }
          }, 90);
          return { abort: () => clearInterval(t) };
        },
      };

      if (MOCK) {
        setInterval(() => Mock.advance(0.25), 250);
        document.documentElement.classList.add("mock");
      }

      async function api(path, opts) {
        if (MOCK) {
          const body = opts && opts.body ? JSON.parse(opts.body) : null;
          await new Promise((r) => setTimeout(r, Mock.lat));
          return Mock.handle(path, (opts && opts.method) || "GET", body);
        }
        const r = await fetch(path, opts);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const ct = r.headers.get("content-type") || "";
        return ct.includes("json") ? r.json() : r.text();
      }
      const post = (path, body) =>
        api(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        });

      function setFill(input) {
        const min = +input.min || 0,
          max = +input.max || 100;
        input.style.setProperty(
          "--fill",
          ((input.value - min) / (max - min || 1)) * 100 + "%",
        );
      }

      /* ========= state ========= */
      const S = {
        songs: [],
        filter: "all",
        query: "",
        status: {},
        seeking: false,
        volTouch: 0,
        btOpen: false,
        btScanning: false,
        btDevices: [],
      };

      /* ========= library ========= */
      async function loadSongs() {
        try {
          const d = await api("/api/songs");
          S.songs = Array.isArray(d) ? d : d.songs || [];
          renderSongs();
        } catch (e) {
          toast("Falha ao listar músicas", true);
        }
      }

      function visibleSongs() {
        const q = S.query.trim().toLowerCase();
        return S.songs.filter((s) => {
          const e = ext(s.name);
          if (S.filter !== "all" && e !== S.filter) return false;
          if (!q) return true;
          return (
            s.name.toLowerCase().includes(q) ||
            (s.artist || "").toLowerCase().includes(q) ||
            (s.genre || "").toLowerCase().includes(q)
          );
        });
      }

      function renderSongs() {
        const box = $("#songs"),
          list = visibleSongs();
        const cur = S.status.file || "";
        box.textContent = "";
        $("#libCount").textContent = S.songs.length
          ? list.length +
            " de " +
            S.songs.length +
            " arquivo" +
            (S.songs.length > 1 ? "s" : "")
          : "";

        if (!list.length) {
          const e = el("div", "empty");
          e.textContent = S.songs.length
            ? "Nenhuma música encontrada para este filtro."
            : "Sua biblioteca está vazia. Envie um arquivo acima.";
          box.appendChild(e);
          return;
        }

        const frag = document.createDocumentFragment();
        for (const s of list) {
          const e = ext(s.name);
          const row = el("div", "song" + (s.name === cur ? " now" : ""));

          const pb = el("button", "pbtn");
          pb.title = "Tocar";
          pb.innerHTML =
            '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
          pb.onclick = () => playFile(s.name);

          const meta = el("div", "meta");
          const t = el("div", "t");
          t.textContent = baseName(s.name);
          t.title = s.name;
          const sub = el("div", "s");
          const tag = el(
            "span",
            "tag " + (e === "mp3" || e === "wav" ? e : ""),
          );
          tag.textContent = e.toUpperCase();
          sub.appendChild(tag);
          const sz = el("span");
          sz.textContent = fmtSize(s.size);
          sub.appendChild(sz);
          if (s.artist) {
            const ar = el("span");
            ar.textContent = s.artist;
            sub.appendChild(ar);
          }
          if (s.genre) {
            const gn = el("span", "tag gen");
            gn.textContent = s.genre;
            sub.appendChild(gn);
          }
          meta.append(t, sub);

          const edit = el("button", "del");
          edit.title = "Editar artista / genero";
          edit.innerHTML =
            '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
          edit.onclick = () => openMeta(s.name);

          const del = el("button", "del");
          del.title = "Apagar";
          del.innerHTML =
            '<svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 12H7z"/></svg>';
          del.onclick = () => delFile(s.name);

          row.append(pb, meta, edit, del);
          frag.appendChild(row);
        }
        box.appendChild(frag);
      }

      async function playFile(name) {
        try {
          await post("/api/play", { file: name });
          pullStatus();
        } catch (e) {
          toast("Não foi possível tocar", true);
        }
      }

      async function delFile(name) {
        if (!confirm('Apagar "' + name + '" do cartão SD?')) return;
        try {
          await post("/api/delete", { file: name });
          S.songs = S.songs.filter((s) => s.name !== name);
          renderSongs();
          toast("Arquivo apagado");
        } catch (e) {
          toast("Falha ao apagar", true);
        }
      }

      /* ========= upload ========= */
      const OK_EXT = ["mp3", "wav"];

      function pickFiles(files) {
        const arr = [...files].filter((f) => {
          if (OK_EXT.includes(ext(f.name))) return true;
          toast("Formato não suportado: " + f.name, true);
          return false;
        });
        arr.forEach(uploadOne);
      }

      function uploadOne(file) {
        const item = el("div", "up-item");
        const head = el("div", "up-head");
        const nm = el("span", "nm");
        nm.textContent = file.name;
        const pc = el("span", "pc");
        pc.textContent = "0%";
        const x = el("button", "x");
        x.textContent = "✕";
        x.title = "Cancelar";
        head.append(nm, pc, x);
        const bar = el("div", "bar");
        const fill = el("i");
        bar.appendChild(fill);
        item.append(head, bar);
        $("#upList").appendChild(item);

        const progress = (loaded, total) => {
          const p = Math.round((loaded / total) * 100);
          fill.style.width = p + "%";
          pc.textContent = p + "%";
        };
        const done = () => {
          item.classList.add("done");
          fill.style.width = "100%";
          pc.textContent = "OK";
          x.textContent = "✓";
          x.onclick = null;
          setTimeout(() => item.remove(), 2200);
          loadSongs();
        };
        const fail = (msg) => {
          item.classList.add("err");
          pc.textContent = msg;
          fill.style.width = "100%";
          toast("Falha ao enviar " + file.name, true);
        };

        if (MOCK) {
          const job = Mock.upload(file, progress, done, fail);
          x.onclick = () => {
            job.abort();
            item.remove();
          };
          return;
        }

        const fd = new FormData();
        fd.append("file", file, file.name);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/upload");

        xhr.upload.onprogress = (ev) => {
          if (ev.lengthComputable) progress(ev.loaded, ev.total);
        };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) done();
          else fail("Erro " + xhr.status);
        };
        xhr.onerror = () => fail("Falha de rede");
        xhr.onabort = () => item.remove();
        x.onclick = () => xhr.abort();

        xhr.send(fd);
      }

      /* ========= player ========= */
      function renderStatus(st) {
        const prev = S.status;
        S.status = st;

        // Header
        if (st.device) $("#devName").textContent = st.device;
        $("#wifi").textContent =
          st.wifi && st.wifi.connected
            ? (st.wifi.ssid || "Wi-Fi") + " · " + (st.wifi.ip || "")
            : "Wi-Fi desconectado";

        // Bluetooth chip
        const bt = st.bt || {};
        const chip = $("#btChip");
        chip.className =
          "chip" +
          (bt.state === "connected"
            ? " ok"
            : bt.state === "scanning" || bt.state === "connecting"
              ? " busy"
              : "");
        $("#btLbl").textContent =
          bt.state === "connected"
            ? bt.name || "Conectado"
            : bt.state === "connecting"
              ? "Conectando…"
              : bt.state === "scanning"
                ? "Escaneando…"
                : "Desconectado";

        // Now playing
        const file = st.file || "";
        $("#npTitle").textContent = file ? baseName(file) : "Nada tocando";
        $("#npSub").textContent = file
          ? ext(file).toUpperCase() + (st.playing ? " · tocando" : " · pausado")
          : "—";
        $("#art").classList.toggle("on", !!st.playing);
        $("#playIcon").innerHTML = st.playing
          ? '<path d="M7 4h4v16H7zm6 0h4v16h-4z"/>'
          : '<path d="M6 4l14 8-14 8z"/>';

        // Seek
        if (!S.seeking) {
          const dur = st.duration || 0,
            pos = st.position || 0;
          const sk = $("#seek");
          sk.max = dur > 0 ? dur : 100;
          sk.value = dur > 0 ? Math.min(pos, dur) : 0;
          sk.disabled = dur <= 0;
          setFill(sk);
          $("#tCur").textContent = fmtTime(pos);
          $("#tTot").textContent = fmtTime(dur);
        }

        // Volume (don't fight the user for 1.2s after touching it)
        if (Date.now() - S.volTouch > 1200 && typeof st.volume === "number") {
          const v = $("#vol");
          v.value = st.volume;
          setFill(v);
        }

        // Repaint list only when the current track changed
        if ((prev.file || "") !== file) {
          renderSongs();
          if (prev.file) loadStats(); // a faixa anterior pode ter virado scrobble
        }

        // Bluetooth modal live refresh
        if (S.btOpen) {
          if (Array.isArray(st.btDevices)) S.btDevices = st.btDevices;
          S.btScanning = bt.state === "scanning";
          renderBt();
        }
      }

      async function pullStatus() {
        try {
          renderStatus(await api("/api/status"));
        } catch (e) {
          /* ESP ocupado: ignora o tick */
        }
      }

      /* ========= metadados (artista / genero) ========= */
      function openMeta(name) {
        const s = S.songs.find((x) => x.name === name);
        if (!s) return;
        S.metaFile = name;
        $("#metaFile").textContent = name;
        $("#metaArtist").value = s.artist || "";
        $("#metaGenre").value = s.genre || "";

        // sugere generos ja usados, para nao virar zoo de grafias
        const chips = $("#genreChips");
        chips.textContent = "";
        const seen = [...new Set(S.songs.map((x) => x.genre).filter(Boolean))];
        for (const g of seen.slice(0, 12)) {
          const b = el("button");
          b.type = "button";
          b.textContent = g;
          b.onclick = () => ($("#metaGenre").value = g);
          chips.appendChild(b);
        }
        $("#metaMask").classList.add("on");
        setTimeout(() => $("#metaArtist").focus(), 60);
      }
      const closeMeta = () => $("#metaMask").classList.remove("on");

      async function saveMeta() {
        const file = S.metaFile;
        const artist = $("#metaArtist").value.trim();
        const genre = $("#metaGenre").value.trim();
        const btn = $("#metaSave");
        btn.disabled = true;
        btn.textContent = "Salvando…";
        try {
          await post("/api/meta", { file, artist, genre });
          const s = S.songs.find((x) => x.name === file);
          if (s) {
            s.artist = artist;
            s.genre = genre;
          }
          renderSongs();
          closeMeta();
          toast("Detalhes salvos");
        } catch (e) {
          toast("Falha ao salvar", true);
        }
        btn.disabled = false;
        btn.textContent = "Salvar";
      }

      /* ========= estatisticas ========= */
      function renderStats(d) {
        const box = $("#stats");
        box.textContent = "";
        const plays = d.plays || 0;
        $("#statSum").textContent = plays
          ? plays + " reproducoes · " + fmtTime(d.seconds || 0) + " ouvidos"
          : "";

        if (!plays) {
          const e = el("div", "empty");
          e.textContent =
            "Nenhuma musica registrada ainda. Toque algo e volte aqui.";
          box.appendChild(e);
          return;
        }

        const section = (title, rows) => {
          if (!rows || !rows.length) return;
          const h = el("div");
          h.style.cssText =
            "font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px";
          h.textContent = title;
          box.appendChild(h);
          const max = rows[0].plays || 1;
          for (const r of rows) {
            const row = el("div", "song");
            const m = el("div", "meta");
            const t = el("div", "t");
            t.textContent = r.name;
            const bar = el("div", "bar");
            bar.style.marginTop = "6px";
            const fill = el("i");
            fill.style.width = (r.plays / max) * 100 + "%";
            bar.appendChild(fill);
            m.append(t, bar);
            const c = el("span");
            c.style.cssText =
              "font-size:12px;color:var(--txt2);min-width:52px;text-align:right";
            c.textContent = r.plays + "x";
            row.append(m, c);
            box.appendChild(row);
          }
        };
        section("Top artistas", d.topArtists);
        section("Top generos", d.topGenres);
      }

      async function loadStats() {
        try {
          renderStats(await api("/api/stats"));
        } catch (e) {
          /* historico ainda vazio */
        }
      }

      /* ========= bluetooth ========= */
      function renderBt() {
        const bt = S.status.bt || {};
        const cur = $("#btCurrent");
        cur.textContent = "";
        if (bt.state === "connected") {
          const d = el("div", "dev cur");
          const m = el("div", "meta");
          const n = el("div", "n");
          n.textContent = bt.name || "Dispositivo";
          const a = el("div", "a");
          a.textContent = bt.address || "";
          m.append(n, a);
          const b = el("button", "btn ghost");
          b.textContent = "Desconectar";
          b.onclick = async () => {
            try {
              await post("/api/bt-disconnect");
              pullStatus();
            } catch (e) {
              toast("Falha", true);
            }
          };
          d.append(m, b);
          cur.appendChild(d);
        }

        const scan = $("#btScan");
        scan.disabled = S.btScanning;
        scan.textContent = S.btScanning
          ? "Procurando…"
          : "Procurar dispositivos";

        const box = $("#btList");
        box.textContent = "";
        if (!S.btDevices.length) {
          const e = el("div", "empty");
          e.textContent = S.btScanning
            ? "Aguarde, escaneando…"
            : "Nenhum dispositivo encontrado ainda.";
          box.appendChild(e);
          return;
        }
        for (const dev of S.btDevices) {
          const d = el(
            "div",
            "dev" +
              (dev.address === bt.address && bt.state === "connected"
                ? " cur"
                : ""),
          );
          const m = el("div", "meta");
          const n = el("div", "n");
          n.textContent = dev.name || "(sem nome)";
          const a = el("div", "a");
          a.textContent =
            (dev.address || "") +
            (dev.rssi != null ? "  ·  " + dev.rssi + " dBm" : "");
          m.append(n, a);
          const b = el("button", "btn");
          b.textContent = "Conectar";
          b.onclick = async () => {
            b.disabled = true;
            b.textContent = "…";
            try {
              await post("/api/bt-connect", {
                address: dev.address,
                name: dev.name,
              });
              toast("Conectando…");
            } catch (e) {
              toast("Falha ao conectar", true);
              b.disabled = false;
              b.textContent = "Conectar";
            }
            pullStatus();
          };
          d.append(m, b);
          box.appendChild(d);
        }
      }

      async function openBt() {
        S.btOpen = true;
        $("#btMask").classList.add("on");
        renderBt();
        try {
          S.btDevices = (await api("/api/bt-devices")).devices || [];
          renderBt();
        } catch (e) {}
      }
      function closeBt() {
        S.btOpen = false;
        $("#btMask").classList.remove("on");
      }

      /* ========= wiring ========= */
      (function init() {
        // upload
        const drop = $("#drop"),
          fileIn = $("#file");
        drop.onclick = () => fileIn.click();
        fileIn.onchange = () => {
          pickFiles(fileIn.files);
          fileIn.value = "";
        };
        ["dragenter", "dragover"].forEach((ev) =>
          drop.addEventListener(ev, (e) => {
            e.preventDefault();
            drop.classList.add("over");
          }),
        );
        ["dragleave", "drop"].forEach((ev) =>
          drop.addEventListener(ev, (e) => {
            e.preventDefault();
            drop.classList.remove("over");
          }),
        );
        drop.addEventListener("drop", (e) => {
          if (e.dataTransfer.files.length) pickFiles(e.dataTransfer.files);
        });
        window.addEventListener("dragover", (e) => e.preventDefault());
        window.addEventListener("drop", (e) => e.preventDefault());

        // filters
        $("#tabs").onclick = (e) => {
          const b = e.target.closest("button[data-f]");
          if (!b) return;
          S.filter = b.dataset.f;
          [...$("#tabs").children].forEach((c) =>
            c.classList.toggle("on", c === b),
          );
          renderSongs();
        };
        let qt;
        $("#q").oninput = (e) => {
          clearTimeout(qt);
          qt = setTimeout(() => {
            S.query = e.target.value;
            renderSongs();
          }, 120);
        };

        // transport
        $("#play").onclick = async () => {
          try {
            await post(S.status.playing ? "/api/pause" : "/api/resume");
            pullStatus();
          } catch (e) {
            toast("Falha no comando", true);
          }
        };
        $("#prev").onclick = () =>
          post("/api/prev")
            .then(pullStatus)
            .catch(() => toast("Falha", true));
        $("#next").onclick = () =>
          post("/api/next")
            .then(pullStatus)
            .catch(() => toast("Falha", true));

        // seek
        const sk = $("#seek");
        const startSeek = () => {
          S.seeking = true;
        };
        sk.addEventListener("pointerdown", startSeek);
        sk.addEventListener("keydown", startSeek);
        sk.addEventListener("input", () => {
          setFill(sk);
          $("#tCur").textContent = fmtTime(sk.value);
        });
        const endSeek = async () => {
          if (!S.seeking) return;
          S.seeking = false;
          try {
            await post("/api/seek", { position: +sk.value });
          } catch (e) {
            toast("Falha ao buscar", true);
          }
          pullStatus();
        };
        sk.addEventListener("change", endSeek);
        sk.addEventListener("pointerup", endSeek);
        sk.addEventListener("pointercancel", () => {
          S.seeking = false;
        });

        // volume (throttled to protect the ESP32)
        const vol = $("#vol");
        let vTimer = null;
        vol.oninput = () => {
          setFill(vol);
          S.volTouch = Date.now();
          if (vTimer) return;
          vTimer = setTimeout(() => {
            vTimer = null;
            post("/api/volume", { volume: +vol.value }).catch(() => {});
          }, 150);
        };
        setFill(vol);
        setFill(sk);

        // bluetooth
        $("#btChip").onclick = openBt;
        $("#btClose").onclick = closeBt;
        $("#btMask").onclick = (e) => {
          if (e.target === $("#btMask")) closeBt();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && S.btOpen) closeBt();
        });
        $("#btScan").onclick = async () => {
          S.btScanning = true;
          S.btDevices = [];
          renderBt();
          try {
            await post("/api/bt-scan", { duration: 8 });
          } catch (e) {
            S.btScanning = false;
            renderBt();
            toast("Falha ao escanear", true);
          }
        };

        // keyboard shortcut: space toggles play unless typing
        document.addEventListener("keydown", (e) => {
          if (e.code !== "Space") return;
          const t = e.target.tagName;
          if (t === "INPUT" || t === "TEXTAREA" || t === "BUTTON") return;
          e.preventDefault();
          $("#play").click();
        });

        // metadados
        // no modo de testes o CSV e gerado no proprio browser
        if (MOCK) {
          $("#dlCsv").onclick = (e) => {
            e.preventDefault();
            const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
            const rows = [
              "timestamp,datetime,file,artist,genre,listened_secs,duration_secs,completed",
            ];
            for (const h of Mock.history) {
              const s = Mock.songs.find((x) => x.name === h.file) || {};
              rows.push(
                [
                  Math.floor(h.ts),
                  esc(new Date(h.ts * 1000).toISOString().slice(0, 19).replace("T", " ")),
                  esc(h.file),
                  esc(h.artist),
                  esc(h.genre),
                  h.secs,
                  s.duration || 0,
                  s.duration && h.secs >= s.duration * 0.9 ? 1 : 0,
                ].join(","),
              );
            }
            const url = URL.createObjectURL(
              new Blob([rows.join("\n")], { type: "text/csv" }),
            );
            const a = el("a");
            a.href = url;
            a.download = "localfy-history.csv";
            a.click();
            URL.revokeObjectURL(url);
          };
        }

        $("#metaClose").onclick = closeMeta;
        $("#metaSave").onclick = saveMeta;
        $("#metaMask").onclick = (e) => {
          if (e.target === $("#metaMask")) closeMeta();
        };
        $("#metaGenre").onkeydown = $("#metaArtist").onkeydown = (e) => {
          if (e.key === "Enter") saveMeta();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && $("#metaMask").classList.contains("on"))
            closeMeta();
        });

        // modo de testes: botão na barra + tecla M (fora de campos de texto)
        const setMock = (on) => {
          try {
            localStorage.setItem("localfyMock", on ? "1" : "0");
          } catch (e) {}
          const u = new URL(location.href);
          u.searchParams.set("mock", on ? "1" : "0");
          location.replace(u);
        };
        $("#mockOff").onclick = () => setMock(false);
        document.addEventListener("keydown", (e) => {
          if (e.key !== "m" && e.key !== "M") return;
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          const t = e.target.tagName;
          if (t === "INPUT" || t === "TEXTAREA") return;
          setMock(!MOCK);
        });

        // boot + polling
        loadSongs();
        loadStats();
        pullStatus();
        setInterval(() => {
          if (!document.hidden) pullStatus();
        }, 1500);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) pullStatus();
        });
      })();
    </script>
  </body>
</html>
